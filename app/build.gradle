plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pontodevirada.jogo'
    compileSdk 34

    defaultConfig {
        applicationId "com.pontodevirada.jogo"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // assinado com a chave de teste para poder instalar direto no celular
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
