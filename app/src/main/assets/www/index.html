<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0e14">
<title>Ponto de Virada</title>
<style>
@font-face{font-family:"Big Shoulders Display";font-weight:500;font-display:swap;src:url(fonts/big-shoulders-display-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Big Shoulders Display";font-weight:800;font-display:swap;src:url(fonts/big-shoulders-display-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Newsreader";font-weight:400;font-display:swap;src:url(fonts/newsreader-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Newsreader";font-weight:500;font-display:swap;src:url(fonts/newsreader-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Newsreader";font-weight:400;font-style:italic;font-display:swap;src:url(fonts/newsreader-latin-400-italic.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:400;font-display:swap;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:600;font-display:swap;src:url(fonts/jetbrains-mono-latin-600-normal.woff2) format("woff2")}
:root{--sat:0px;--sab:0px;--sal:0px;--sar:0px;--st:max(env(safe-area-inset-top,0px),var(--sat));--sb:max(env(safe-area-inset-bottom,0px),var(--sab));--sl:max(env(safe-area-inset-left,0px),var(--sal));--sr:max(env(safe-area-inset-right,0px),var(--sar))}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{margin:0;font-size:14px;font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
img{max-width:100%}[hidden]{display:none!important}

/* Layout: tela vertical de "vídeo" — cena animada no fundo, hora/profundidade em destaque, narração, ações ao alcance do polegar */
:root {
  --night: #0b0e14;
  --night-2: #141924;
  --ink: #e9e4d8;
  --ink-dim: #9a968c;
  --acc: #f2a33a;
  --acc-rgb: 242,163,58;
  --signal: #e2483d;
  --line: #2a3140;
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "Newsreader", Georgia, "Times New Roman", serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--ink); font-family: var(--f-body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
.vignette {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(to bottom, transparent 35%, rgba(11,14,20,.7) 60%, var(--night) 92%);
}
.app {
  position: relative; z-index: 2; height: 100%;
  max-width: 560px; margin: 0 auto;
  display: flex; flex-direction: column;
  padding-left: max(16px, var(--sl));
  padding-right: max(16px, var(--sr));
  padding-top: calc(var(--st) + 12px);
  padding-bottom: calc(var(--sb) + 16px); box-sizing: border-box;
}
.top {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim);
}
.top .grp { display: flex; gap: 6px; }
.top button {
  font: inherit; letter-spacing: inherit; text-transform: inherit;
  background: rgba(11,14,20,.6); border: 1px solid var(--line); color: var(--ink-dim);
  padding: 6px 10px; border-radius: 999px; cursor: pointer;
}
.top button:focus-visible { color: var(--ink); border-color: var(--ink-dim); outline: none; }
.rec { display: inline-flex; align-items: center; gap: 7px; }
.rec i { width: 7px; height: 7px; border-radius: 50%; background: var(--signal); animation: blink 1.6s infinite; }
@keyframes blink { 50% { opacity: .2; } }

.hud { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; min-height: 22px; align-items: center; }
.chip {
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 9px; color: var(--ink-dim);
  background: rgba(11,14,20,.6);
}
.meter { display: flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 11px; color: var(--ink); letter-spacing: .08em; }
.meter .bar { width: 110px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--acc); transition: width .6s ease; }
.meter.baixo { color: var(--signal); }
.meter.baixo .bar i { background: var(--signal); }

.scene { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; padding-block: 14px; scrollbar-width: none; }
.scene::-webkit-scrollbar { display: none; }
.scene > :first-child { margin-top: auto; }
.clock {
  font-family: var(--f-display); font-weight: 800;
  font-size: clamp(60px, 21vw, 108px); line-height: .85; letter-spacing: -.01em; color: var(--acc);
  text-shadow: 0 0 28px rgba(var(--acc-rgb),.45);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.place { font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); margin-top: 10px; }
.text { font-size: 21px; line-height: 1.45; margin-top: 18px; max-width: 34ch; min-height: 4.4em; text-shadow: 0 1px 12px var(--night); }
.text em { color: var(--acc); font-style: italic; }
.text .msg { font-family: var(--f-mono); font-size: .78em; color: var(--signal); letter-spacing: .04em; }
.caret { display: inline-block; width: .5ch; background: var(--acc); animation: blink 1s infinite; margin-left: 2px; }
.hint, .dica { font-family: var(--f-mono); font-size: 11px; color: var(--ink-dim); margin-top: 12px; letter-spacing: .08em; }
.dica { color: var(--acc); }

.choices { display: grid; gap: 10px; }
.timer { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.timer i { display: block; height: 100%; width: 100%; background: var(--acc); }
.timer.urgente i { background: var(--signal); }
.choice {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; cursor: pointer;
  background: rgba(20,25,36,.9);
  border: 1px solid var(--line); color: var(--ink);
  padding: 14px 16px; border-radius: 14px;
  font-family: var(--f-body); font-size: 18px; line-height: 1.25;
  opacity: 0; transform: translateY(10px);
  transition: opacity .35s ease, transform .35s ease, border-color .2s, background .2s;
}
.choice.show { opacity: 1; transform: none; }
.choice .k {
  flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  border: 1px solid var(--acc); color: var(--acc);
  font-family: var(--f-display); font-weight: 800; font-size: 17px;
}
.choice .lbl { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.choice .req { font-family: var(--f-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); }
.choice .custo { flex: none; font-family: var(--f-mono); font-size: 11px; color: var(--ink-dim); }
.choice:focus-visible { border-color: var(--acc); outline: none; background: rgba(var(--acc-rgb),.14); }
.choice:disabled { cursor: not-allowed; }
.choice.show:disabled { opacity: .4; }
.choice:disabled .k { border-color: var(--line); color: var(--ink-dim); }
.choice.picked { border-color: var(--acc); background: rgba(var(--acc-rgb),.26); }
.choice.faded { opacity: .25 !important; }

/* Ações especiais */
.acao { display: grid; gap: 12px; }
.acao-l { font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--acc); }
.big {
  position: relative; overflow: hidden; width: 100%; height: 76px; border-radius: 16px; cursor: pointer;
  border: 1.5px solid var(--acc); background: rgba(20,25,36,.88); color: var(--ink);
  font-family: var(--f-display); font-weight: 800; font-size: 30px; letter-spacing: .04em; text-transform: uppercase;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none;
}
.big .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: rgba(var(--acc-rgb),.4); }
.big span { position: relative; }
.big:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.big.bate { animation: bate .12s; }
.big.perigo { border-color: var(--signal); color: var(--signal); background: rgba(226,72,61,.18); }
.big.seguro { border-color: var(--ink-dim); }
@keyframes bate { 50% { transform: scale(.97); } }
.slots { display: flex; gap: 8px; justify-content: center; }
.slots b {
  width: 46px; height: 56px; display: grid; place-items: center; border-radius: 10px;
  border: 1px solid var(--line); font-family: var(--f-display); font-weight: 800; font-size: 34px; color: var(--acc);
  background: rgba(11,14,20,.7);
}
.pad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pad button {
  height: 50px; border-radius: 12px; border: 1px solid var(--line); cursor: pointer;
  background: rgba(20,25,36,.9); color: var(--ink);
  font-family: var(--f-mono); font-size: 18px;
}
.pad button:active { background: rgba(var(--acc-rgb),.3); }
.pad button:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }

.toast {
  position: fixed; z-index: 4; left: 50%; transform: translate(-50%, -8px);
  top: calc(var(--st) + 54px);
  font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em;
  background: var(--night-2); color: var(--ink); border: 1px solid var(--acc);
  padding: 8px 14px; border-radius: 999px; opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none;
  max-width: calc(100% - 32px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

.end-tag {
  display: inline-block; align-self: flex-start;
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
  padding: 5px 10px; border-radius: 999px; border: 1px solid currentColor; margin-bottom: 14px;
}
.end-tag.bom { color: var(--acc); }
.end-tag.ruim { color: var(--signal); }
.end-tag.estranho { color: var(--ink-dim); }
.end-tag.secreto { color: #ffd24d; text-shadow: 0 0 12px rgba(255,210,77,.6); }
.slot .t.secreto { color: #ffd24d; }

/* cinemática: faixas de cinema, sem texto nem opções até a cena acabar */
.faixa { position: fixed; left: 0; right: 0; height: 9vh; background: #000; z-index: 3; pointer-events: none; transition: transform .7s ease; }
.faixa.cima { top: 0; transform: translateY(-100%); }
.faixa.baixo { bottom: 0; transform: translateY(100%); }
body.cine .faixa { transform: none; }
.vignette { transition: opacity .8s ease; }
body.cine .vignette { opacity: .2; }
body.cine #choices, body.cine #hud, body.cine .text, body.cine .hint, body.cine .dica, body.cine .top .grp { opacity: 0; pointer-events: none; }
body.cine .scene > :first-child { margin-top: auto; }
#choices, #hud, .text, .hint, .dica, .top .grp { transition: opacity .5s ease; }
.pular {
  position: fixed; z-index: 4; right: max(16px, var(--sr)); bottom: calc(9vh + 14px);
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink); background: rgba(11,14,20,.6); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px;
  opacity: 0; pointer-events: none; transition: opacity .4s;
}
body.cine .pular { opacity: 1; pointer-events: auto; }
.cine-leg { position: fixed; z-index: 4; left: 0; right: 0; bottom: calc(9vh + 56px); text-align: center; font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); opacity: 0; transition: opacity .5s; pointer-events: none; }
body.cine .cine-leg { opacity: 1; }
body.no-hub .app .top, body.no-hub .app .hud { visibility: hidden; }

.choice .novo { flex: none; font-family: var(--f-mono); font-size: 9px; letter-spacing: .14em; color: var(--night); background: var(--acc); border-radius: 999px; padding: 3px 7px; font-weight: 600; }
.choice.lembranca { border-style: dashed; border-color: #ffd24d; }
.choice.lembranca .k { border-color: #ffd24d; color: #ffd24d; }
.story.trancada { opacity: .55; cursor: not-allowed; }
.story.trancada h3 { color: var(--ink-dim); }
.story .barra { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.story .barra i { display: block; height: 100%; background: var(--c); }
.progresso { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.progresso button { font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--acc); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; cursor: pointer; }
.conqs { display: grid; gap: 8px; }
.conq { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.conq b { font-family: var(--f-display); font-weight: 800; font-size: 20px; text-transform: uppercase; line-height: 1; }
.conq span { font-size: 14px; color: var(--ink-dim); }
.conq i { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-style: normal; border: 1px solid var(--line); color: var(--line); font-family: var(--f-display); font-weight: 800; }
.conq.ok i { border-color: #ffd24d; color: #ffd24d; }
.conq:not(.ok) b { color: var(--ink-dim); }
.drawer h3 { font-family: var(--f-display); font-weight: 800; font-size: 28px; margin: 8px 0 0; text-transform: uppercase; color: var(--ink); }
.end-title { font-family: var(--f-display); font-weight: 800; font-size: clamp(46px, 14vw, 78px); line-height: .9; text-transform: uppercase; text-wrap: balance; }
.path { margin-top: 16px; font-family: var(--f-mono); font-size: 11px; color: var(--ink-dim); line-height: 1.7; letter-spacing: .04em; }
.path b { color: var(--ink); font-weight: 600; }

.overlay {
  position: fixed; inset: 0; z-index: 5;
  display: flex; justify-content: center;
  padding-left: max(16px, var(--sl));
  padding-right: max(16px, var(--sr));
  padding-top: calc(var(--st) + 24px);
  padding-bottom: calc(var(--sb) + 24px);
  overflow-y: auto; box-sizing: border-box;
}
.drawer { background: rgba(11,14,20,.95); }
.hub { background: linear-gradient(to bottom, transparent 0%, rgba(11,14,20,.78) 35%, var(--night) 70%); }
.inner { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 16px; margin-top: auto; }
.hub h1 {
  font-family: var(--f-display); font-weight: 800; margin: 0;
  font-size: clamp(58px, 18vw, 100px); line-height: .85; text-transform: uppercase;
}
.hub h1 span { color: var(--acc); text-shadow: 0 0 30px rgba(var(--acc-rgb),.4); }
.hub p, .drawer p { margin: 0; color: var(--ink-dim); font-size: 18px; }
.lista { display: grid; gap: 12px; }
.story {
  text-align: left; cursor: pointer; display: grid; gap: 6px;
  background: rgba(20,25,36,.88); color: var(--ink);
  border: 1px solid var(--line); border-radius: 16px; padding: 16px;
  font-family: var(--f-body);
}
.story:focus-visible { border-color: var(--c); outline: none; }
.story .g { font-family: var(--f-mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim); display: flex; justify-content: space-between; gap: 8px; }
.story h3 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 36px; line-height: .95; text-transform: uppercase; color: var(--c); }
.story .gancho { font-size: 17px; line-height: 1.35; color: var(--ink); }
.story .mec { font-family: var(--f-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); }
.continuar { border-style: dashed; }
.drawer h2 { font-family: var(--f-display); font-weight: 800; font-size: 44px; margin: 0; text-transform: uppercase; color: var(--acc); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.slot { border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-height: 64px; display: flex; flex-direction: column; gap: 6px; }
.slot .n { font-family: var(--f-mono); font-size: 10px; letter-spacing: .14em; color: var(--ink-dim); }
.slot .t { font-family: var(--f-display); font-weight: 800; font-size: 22px; text-transform: uppercase; line-height: 1; }
.slot.locked .t { color: var(--line); }
.btn {
  align-self: flex-start; font-family: var(--f-mono); font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
  background: var(--acc); color: var(--night); border: 0; padding: 14px 22px; border-radius: 999px; cursor: pointer; font-weight: 600;
}
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

@media (hover: hover) {
  .top button:hover { color: var(--ink); border-color: var(--ink-dim); }
  .choice:hover:not(:disabled) { border-color: var(--acc); background: rgba(var(--acc-rgb),.14); }
  .story:hover { border-color: var(--c); }
}
.choice:active:not(:disabled) { transform: scale(.98); }
/* telas baixas (celulares pequenos) */
@media (max-height: 720px) {
  .clock { font-size: clamp(50px, 17vw, 84px); }
  .text { font-size: 18px; margin-top: 12px; min-height: 0; }
  .choice { font-size: 16px; padding: 11px 14px; }
  .choices { gap: 8px; }
  .big { height: 64px; font-size: 26px; }
  .pad button { height: 44px; }
  .slots b { height: 48px; font-size: 30px; }
  .story h3 { font-size: 30px; }
  .story .gancho { font-size: 15px; }
  .hub h1 { font-size: clamp(48px, 15vw, 80px); }
}
@media (max-height: 600px) {
  .text { font-size: 16.5px; line-height: 1.38; }
  .place { margin-top: 6px; }
  .choice { font-size: 15px; padding: 9px 12px; }
  .choice .k { width: 26px; height: 26px; font-size: 15px; }
}
</style>
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="vignette"></div>
<div class="toast" id="toast" role="status"></div>
<div class="faixa cima"></div><div class="faixa baixo"></div>
<div class="cine-leg" id="cineLeg"></div>
<button class="pular" id="pular" type="button">Pular ▸▸</button>

<main class="app">
  <div class="top">
    <span class="rec"><i></i><span id="sceneNo">Cena 01</span></span>
    <div class="grp">
      <button id="btnMenu" type="button">Menu</button>
      <button id="btnSom" type="button" aria-pressed="true">Som</button>
      <button id="openEndings" type="button">Finais <span id="endCount">0/0</span></button>
    </div>
  </div>
  <div class="hud" id="hud"></div>
  <section class="scene" id="scene" aria-live="polite"></section>
  <div class="choices" id="choices"></div>
</main>

<div class="overlay hub" id="hub">
  <div class="inner">
    <div class="place">Histórias em que você decide</div>
    <h1>Ponto de <span>Virada</span></h1>
    <p>Escolha uma fase. Use fone de ouvido: o som faz parte do jogo.</p>
    <div class="progresso"><span id="progTotal"></span><button id="btnConq" type="button">Conquistas</button></div>
    <div class="lista" id="lista"></div>
  </div>
</div>

<div class="overlay drawer" id="drawer" hidden>
  <div class="inner" style="margin-top:0">
    <h2 id="drawerTitle">Finais</h2>
    <p id="drawerSub">Cada escolha leva a um lugar diferente. Volte e tente outros caminhos.</p>
    <div class="grid" id="endGrid"></div>
    <h3>Conquistas</h3>
    <div class="conqs" id="conqs"></div>
    <button class="btn" id="closeEndings" type="button">Voltar</button>
  </div>
</div>

<script src="historias.js"></script>
<script src="cinema.js"></script>
<script src="cinema2.js"></script>
<script src="historias2.js"></script>
<script>
const TAG = { bom: "Final bom", ruim: "Final ruim", estranho: "Final estranho", secreto: "Final secreto" };
const $ = id => document.getElementById(id);
/* No Android, "remover animações"/economia de bateria ligam o prefers-reduced-motion e o jogo ficava parado.
   Animação faz parte do jogo, então ela fica sempre ligada. */
const reduz = false;
function corDestaque(hex) {
  const n = parseInt(hex.slice(1), 16), r = document.documentElement.style;
  r.setProperty("--acc", hex); r.setProperty("--acc-rgb", (n >> 16 & 255) + "," + (n >> 8 & 255) + "," + (n & 255));
}
const finaisDe = k => Object.keys(FASES[k].nos).filter(n => FASES[k].nos[n].fim);

/* ============================================================
   ÁUDIO (sintetizado ao vivo, sem arquivos)
   ============================================================ */
let AC = null, OUT, REV, NB, AMB = {}, mudo = false, timers = [];

function initAudio() {
  if (AC) { AC.resume(); return; }
  AC = new (window.AudioContext || window.webkitAudioContext)();
  OUT = AC.createGain(); OUT.gain.value = mudo ? 0 : .9; OUT.connect(AC.destination);
  REV = AC.createConvolver();
  const len = AC.sampleRate * 2.6, ir = AC.createBuffer(2, len, AC.sampleRate);

const secretosDe = k => finaisDe(k).filter(n => FASES[k].nos[n].tipo === "secreto");

/* ---------- cinemática ---------- */
const OVERLAY = new Set(["escuro", "vermelho", "alarme", "chuva", "farolAtras", "rapido", "bolhasMuitas", "manha"]);
function dispararSusto() { if (mudo || reduz) return; susto = performance.now(); tocar("susto"); vibrar(350); tremer(0, .4); }
function cinePara(c, vista, pronto) {
  const [nome, p = {}] = c.cine;
  const def = CINE[nome];
  if (!def) { cineAtual = null; pronto(); return; }
  const chave = nome + JSON.stringify(p);
  if (cineAtual && cineAtual.chave === chave) { pronto(); return; }
  const dur = def.durDe ? def.durDe(p) : def.dur;
  cineAtual = { def, p, dur, chave, t0: performance.now(), vel: vista ? 1.8 : 1, fim: null };
  if (reduz) { cineAtual.t0 -= dur * 1000; pronto(); return; }
  document.body.classList.add("cine");
  cineAtual.fim = () => { document.body.classList.remove("cine"); pronto(); };
}
function pularCine() {
  if (!cineAtual || !cineAtual.fim) return;
  cineAtual.t0 = performance.now() - cineAtual.dur * 1000 / cineAtual.vel;
}
$("pular").addEventListener("click", e => { e.stopPropagation(); pularCine(); });

/* ---------- conquistas ---------- */

  ["primeiro", "Primeiro Final", "Descubra qualquer final", () => totalFinais() >= 1],
  ["dez", "Curioso", "Descubra 10 finais", () => totalFinais() >= 10],
  ["vinte5", "Colecionador", "Descubra 25 finais", () => totalFinais() >= 25],
  ["todos", "Todos os Caminhos", "Descubra todos os finais do jogo", () => totalFinais() >= totalPossivel()],
  ["fase", "Fase Completa", "Todos os finais de uma fase", () => Object.keys(FASES).some(k => descobertos[k].size >= finaisDe(k).length)],
  ["segredo", "Lembrança", "Encontre um final secreto", () => Object.keys(FASES).some(k => secretosDe(k).some(n => descobertos[k].has(n)))],
  ["segredos", "Memória Completa", "Encontre todos os finais secretos", () => Object.keys(FASES).every(k => secretosDe(k).every(n => descobertos[k].has(n)))],
  ["rapido", "Dedos Rápidos", "Vença 10 desafios de tocar rápido", () => stats.toques >= 10],
  ["frio", "Sangue Frio", "Vença 5 desafios de segurar", () => stats.segurar >= 5],
  ["codigo", "Decifrador", "Acerte 3 códigos", () => stats.codigos >= 3],

  ["sobrevivente", "Sobrevivente", "Descubra um final bom em todas as fases", () => Object.keys(FASES).every(k => [...descobertos[k]].some(n => FASES[k].nos[n] && FASES[k].nos[n].tipo === "bom"))],
  ["fases", "Viajante", "Jogue todas as fases", () => Object.keys(FASES).every(k => vis[k].size > 0)],
  ["explorador", "Explorador", "Visite 120 cenas diferentes", () => Object.values(vis).reduce((n, s) => n + s.size, 0) >= 120],
];
function checarConquistas() {
  CONQ.forEach(([id, nome, , ok]) => {
    if (!conqFeitas.has(id) && ok()) { conqFeitas.add(id); gravar("pv_conq", [...conqFeitas]); setTimeout(() => { aviso("Conquista: " + nome); tocar("item"); vibrar(60); }, 1400); }
  });
}
function salvarJogo() {
  if (S && NOS[atual] && !NOS[atual].fim) gravar("pv_save", { S, atual, caminho, inv, medidor });
  else gravar("pv_save", null);
}

function carregar() {
  let d = {};
  try { d = JSON.parse(localStorage.getItem("pv_finais") || "{}"); } catch (e) {}
  try { const velho = JSON.parse(localStorage.getItem("apagao_finais") || "[]"); if (velho.length) d.apagao = [...new Set([...(d.apagao || []), ...velho])]; } catch (e) {}
  for (const k in FASES) d[k] = new Set(d[k] || []);
  return d;
}
function salvar() {
  const o = {}; for (const k in descobertos) o[k] = [...descobertos[k]];
  try { localStorage.setItem("pv_finais", JSON.stringify(o)); } catch (e) {}
}
function contador() { if (S) $("endCount").textContent = descobertos[S].size + "/" + finaisDe(S).length; }

let toastT;
function aviso(txt) {
  const el = $("toast"); el.textContent = txt; el.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("on"), 2200);
}
function hud() {
  const F = FASES[S]; let h = "";
  if (F.medidor) {
    const baixo = medidor < 30;
    h += `<div class="meter ${baixo ? "baixo" : ""}"><span>${F.medidor.nome}</span><span class="bar"><i style="width:${Math.max(0, medidor)}%"></i></span><span>${Math.max(0, medidor)}%</span></div>`;
  }
  h += inv.map(i => `<span class="chip">${i}</span>`).join("");
  $("hud").innerHTML = h;
}
function gastar(n) {
  const F = FASES[S]; if (!F.medidor || !n) return;
  medidor = Math.max(0, Math.min(100, medidor - n));
  aviso((n > 0 ? "−" : "+") + Math.abs(n) + "% " + F.medidor.nome);
  hud();
}

function escrever(el, html, pronto) {
  if (typing) typing.stop();
  if (reduz) { el.innerHTML = html; pronto(); return { stop() {}, skip() {} }; }
  const tmp = document.createElement("div"); tmp.innerHTML = html;
  const total = tmp.textContent.length;
  let n = 0, timer, fim = false;
  function render(qtd) {
    let resto = qtd; const clone = tmp.cloneNode(true);
    (function corta(node) {
      for (const c of [...node.childNodes]) {
        if (c.nodeType === 3) {
          if (resto <= 0) c.remove();
          else if (c.length > resto) { c.textContent = c.textContent.slice(0, resto); resto = 0; }
          else resto -= c.length;
        } else { if (resto <= 0) c.remove(); else corta(c); }
      }
    })(clone);
    el.innerHTML = clone.innerHTML + (qtd < total ? "<span class='caret'>&nbsp;</span>" : "");
  }
  function passo() { n += 2; render(n); if (n % 6 === 0) tocar("tick"); if (n >= total) acabar(); else timer = setTimeout(passo, 24); }
  function acabar() { if (fim) return; fim = true; clearTimeout(timer); el.innerHTML = html; pronto(); }
  timer = setTimeout(passo, 450);
  return { stop() { fim = true; clearTimeout(timer); }, skip: acabar };
}

function mostrar(id) {
  tok++; pararTudo(); ameaca = null;
  const F = FASES[S];
  let c = NOS[id];
  if (c.custo && !c.fim) gastar(c.custo);
  if (F.medidor && medidor <= 0 && id !== F.medidor.fim) { id = F.medidor.fim; c = NOS[id]; }
  atual = id;
  const jaVista = vis[S].has(id);
  vis[S].add(id); salvarVis(); salvarJogo();
  document.body.classList.remove("cine");
  if (!c.fim) ultimo = { atual: id, caminho: caminho.slice(), inv: inv.filter(x => x !== c.ganha), medidor: medidor == null ? null : medidor + (c.custo || 0) };
  if (c.ganha && !inv.includes(c.ganha)) { inv.push(c.ganha); aviso("+ " + c.ganha); tocar("item"); vibrar(40); }
  hud();

  const cena = $("scene");
  $("choices").innerHTML = "";
  $("sceneNo").textContent = c.fim ? "Fim" : "Cena " + String(caminho.length + 1).padStart(2, "0");
  const fx = c.fx || {};
  const lista = [...(fx.ver || (c.cine || cineAtual ? [] : ["cidade"]))];
  if (!c.cine && lista.some(k => !OVERLAY.has(k))) cineAtual = null;
  if (cineAtual) cineAtual.fim = null;
  const baixo = F.medidor && medidor < 30 && !c.fim;
  if (baixo && !lista.includes("vermelho")) lista.push("vermelho");
  setVer(lista);
  setAmb(fx.amb || { drone: 1 });
  (fx.sons || []).forEach(tocar);
  if (baixo && !(fx.sons || []).includes("coracao")) tocar("coracao");

  if (c.fim) {
    const novo = !descobertos[S].has(id);
    descobertos[S].add(id); salvar(); contador();
    stats.partidas++; gravar("pv_stats", stats);
    const trilha = caminho.map(p => "<b>" + p.escolha + "</b>").join(" → ");
    cena.innerHTML =
      "<span class='end-tag " + c.tipo + "'>" + TAG[c.tipo] + (novo ? " · novo" : "") + "</span>" +
      "<div class='end-title'>" + c.titulo + "</div>" +
      "<div class='place'>" + c.hora + " · " + c.lugar + "</div>" +
      "<div class='text' id='txt'></div>";
    const meuF = tok;
    const escreveFim = () => { if (meuF !== tok) return; typing = escrever($("txt"), c.texto, () => {
      const p = document.createElement("div"); p.className = "path";
      const falta = finaisDe(S).length - descobertos[S].size;
      const prox = Object.entries(FASES).find(([k, F]) => F.libera > totalFinais() - (novo ? 1 : 0) && F.libera <= totalFinais());
      p.innerHTML = "Seu caminho: " + trilha + "<br>Finais desta fase: " + descobertos[S].size + " de " + finaisDe(S).length +
        (falta ? " · faltam " + falta : " · fase completa!") + (prox ? "<br><b>Nova fase liberada: " + prox[1].titulo + "</b>" : "");
      cena.appendChild(p);
      const bs = [];
      if (ultimo) bs.push(op("Voltar à última escolha", "__voltar"));
      bs.push(op("Jogar de novo", "__reiniciar"), op("Ver finais", "__finais"), op("Escolher outra fase", "__menu"));
      botoes(bs);
      checarConquistas();
    }); };
    if (c.cine) cinePara(c, false, escreveFim); else escreveFim();
    return;
  }
  cena.innerHTML =
    "<div class='clock'>" + c.hora + "</div>" +
    "<div class='place'>" + c.lugar + "</div>" +
    "<div class='text' id='txt'></div>" +
    (c.dica ? "<div class='dica'>" + c.dica + "</div>" : "") +
    "<div class='hint' id='hint'>Toque no texto para pular</div>";
  const meu = tok;
  const comecaTexto = () => { if (meu !== tok) return; if (fx.susto) depois(500 + Math.random() * 900, () => { if (meu === tok) dispararSusto(); }); typing = escrever($("txt"), c.texto, () => {
    if (meu !== tok) return;
    const h = $("hint"); if (h) h.remove();
    if (c.acao) iniciarAcao(c.acao);
    else { botoes(c.escolhas); if (c.tempo) cronometro(c.tempo, () => { caminho.push({ escolha: "Hesitou" }); tocar("erro"); mostrar(c.aoAcabar); }); }
  }); };
  if (c.cine) cinePara(c, jaVista, comecaTexto); else comecaTexto();
}

function botoes(lista) {
  const box = $("choices"); box.innerHTML = "";
  lista.forEach((o, i) => {
    const b = document.createElement("button");
    const faltaFinais = o.minFinais && descobertos[S].size < o.minFinais;
    const falta = (o.req && !inv.includes(o.req)) || faltaFinais;
    b.type = "button"; b.className = "choice" + (o.minFinais ? " lembranca" : ""); b.id = "op-" + i; b.disabled = !!falta;
    const nova = NOS && NOS[o.ir] && !vis[S].has(o.ir) && !falta ? `<span class="novo">NOVO</span>` : "";
    const custo = o.custo && FASES[S]?.medidor ? `<span class="custo">${o.custo > 0 ? "−" : "+"}${Math.abs(o.custo)}% ${FASES[S].medidor.nome}</span>` : "";
    const req = o.minFinais ? `<span class="req">${faltaFinais ? "Lembrança trancada · descubra " + o.minFinais + " finais desta fase (" + descobertos[S].size + "/" + o.minFinais + ")" : "Lembrança desbloqueada"}</span>`
      : o.req ? `<span class="req">${falta ? "Precisa: " : "Usar: "}${o.req}</span>` : "";
    const txt = faltaFinais ? "???" : o.t;
    b.innerHTML = `<span class="k">${"ABCD"[i]}</span><span class="lbl"><span>${txt}</span>${req}</span>${custo}${nova}`;
    b.addEventListener("click", ev => { ev.stopPropagation(); escolher(o, b); });
    box.appendChild(b);
    setTimeout(() => b.classList.add("show"), reduz ? 0 : 90 * i + 30);
  });
}

function escolher(o, el) {
  tocar("clique");
  if (o.ir === "__reiniciar") return iniciarFase(S);
  if (o.ir === "__finais") return abrirFinais();
  if (o.ir === "__menu") return abrirHub();
  if (o.ir === "__voltar") {
    const u = ultimo; ultimo = null;
    caminho = u.caminho; inv = u.inv; medidor = u.medidor;
    return mostrar(u.atual);
  }
  tok++;
  [...$("choices").querySelectorAll(".choice")].forEach(b => b.classList.add(b === el ? "picked" : "faded"));
  const tm = $("choices").querySelector(".timer"); if (tm) tm.remove();
  caminho.push({ escolha: o.t });
  if (o.custo) gastar(o.custo);
  setTimeout(() => mostrar(o.ir), reduz ? 0 : 380);
}

/* contagem regressiva visível */
function cronometro(seg, aoFim, onTick) {
  const meu = tok, box = $("choices");
  const bar = document.createElement("div"); bar.className = "timer"; bar.innerHTML = "<i></i>";
  box.prepend(bar);
  const t0 = performance.now(); let ultimo = -1;
  (function loop(now) {
    if (meu !== tok) return;
    const rest = seg - (now - t0) / 1000, fr = Math.max(0, rest / seg);
    bar.firstChild.style.width = fr * 100 + "%";
    bar.classList.toggle("urgente", rest < 3);
    const s = Math.ceil(rest); if (s !== ultimo) { ultimo = s; if (rest < 4) tocar("tique"); }
    if (onTick) onTick(now);
    if (rest <= 0) { aoFim(); if (meu === tok) tok++; return; }
    requestAnimationFrame(loop);
  })(t0);
}

/* minijogos */
function iniciarAcao(a) {
  const box = $("choices"); box.innerHTML = "";
  const meu = tok;
  const wrap = document.createElement("div"); wrap.className = "acao";
  wrap.innerHTML = `<div class="acao-l">${a.rotulo}</div>`;
  box.appendChild(wrap);
  const acabar = ok => {
    if (meu !== tok) return; tok++; ameaca = null;
    tocar(ok ? "sucesso" : "erro");
    if (ok) { if (a.tipo === "esconder" || a.tipo === "avancar") stats.furtivo = (stats.furtivo || 0) + 1; if (a.tipo === "tocar") stats.toques++; if (a.tipo === "segurar") stats.segurar++; if (a.tipo === "codigo") stats.codigos++; gravar("pv_stats", stats); checarConquistas(); }
    caminho.push({ escolha: ok ? "Conseguiu" : "Falhou" });
    aviso(ok ? "Conseguiu!" : "Não deu…");
    setTimeout(() => mostrar(ok ? a.ok : a.falha), 600);
  };

  if (a.tipo === "segurar") {
    const b = document.createElement("button"); b.type = "button"; b.className = "big"; b.id = "acao-segurar";
    b.innerHTML = `<i class="fill"></i><span>Segure</span>`; wrap.appendChild(b);
    let seg = false, prog = 0, ult = performance.now();
    const on = e => { e.preventDefault(); seg = true; try { b.setPointerCapture(e.pointerId); } catch (_) {} };
    const off = () => { seg = false; };
    b.addEventListener("pointerdown", on); b.addEventListener("pointerup", off); b.addEventListener("pointercancel", off); b.addEventListener("lostpointercapture", off);
    b.addEventListener("contextmenu", e => e.preventDefault());
    b.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); seg = true; } });
    b.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") seg = false; });
    cronometro(a.limite, () => acabar(false), now => {
      const dt = (now - ult) / 1000; ult = now;
      prog = Math.max(0, Math.min(1, prog + (seg ? dt / a.dur : -dt / (a.dur * 1.5))));
      b.firstChild.style.width = prog * 100 + "%";
      b.lastChild.textContent = seg ? Math.round(prog * 100) + "%" : prog > 0 ? "Não solte!" : "Segure";
      if (prog >= 1) acabar(true);
    });
    b.focus({ preventScroll: true });
  }

  if (a.tipo === "tocar") {
    const b = document.createElement("button"); b.type = "button"; b.className = "big"; b.id = "acao-tocar";
    b.innerHTML = `<i class="fill"></i><span>0 / ${a.n}</span>`; wrap.appendChild(b);
    let n = 0;
    const bater = e => {
      if (e) e.preventDefault();
      if (meu !== tok) return;
      n++; tocar("toque"); tremer(0, .08);
      b.firstChild.style.width = (n / a.n) * 100 + "%"; b.lastChild.textContent = n + " / " + a.n;
      b.classList.remove("bate"); void b.offsetWidth; b.classList.add("bate");
      if (n >= a.n) acabar(true);
    };
    b.addEventListener("pointerdown", bater);
    b.addEventListener("keydown", e => { if ((e.key === " " || e.key === "Enter") && !e.repeat) bater(e); });
    b.addEventListener("click", e => e.preventDefault());
    cronometro(a.limite, () => acabar(false));
    b.focus({ preventScroll: true });
  }

  if (a.tipo === "esconder" || a.tipo === "avancar") {
    const b = document.createElement("button"); b.type = "button"; b.className = "big"; b.id = "acao-" + a.tipo;
    b.innerHTML = `<i class="fill"></i><span></span>`; wrap.appendChild(b);
    const info = document.createElement("div"); info.className = "hint"; info.style.textAlign = "center"; wrap.appendChild(info);
    ameaca = { tipo: a.tipo, estado: "anda", ate: performance.now() + 1600 + Math.random() * 1200, passo: Math.random() * 6, escondido: false, prog: 0, andando: 0, touca: !!a.touca, quatro: !!a.quatro, pes: !!a.pes };
    const ciclo = now => {
      const A = ameaca; if (!A || now < A.ate) return;
      if (A.estado === "anda") { A.estado = "aviso"; A.ate = now + (a.aviso || 750); tocar("aviso"); vibrar(70); }
      else if (A.estado === "aviso") { A.estado = "olha"; A.ate = now + 1100 + Math.random() * 900; tocar("respira"); }
      else { A.estado = "anda"; A.ate = now + 1200 + Math.random() * 2000; }
    };
    const pego = now => { susto = now; tocar("susto"); vibrar(400); tremer(0, .4); acabar(false); };
    b.addEventListener("contextmenu", e => e.preventDefault());
    if (a.tipo === "esconder") {
      let seg = false, folego = 1, bloqueio = 0, ult = performance.now();
      const on = e => { e.preventDefault(); if (performance.now() > bloqueio) seg = true; try { b.setPointerCapture(e.pointerId); } catch (_) {} };
      const off = () => { seg = false; };
      b.addEventListener("pointerdown", on); b.addEventListener("pointerup", off); b.addEventListener("pointercancel", off); b.addEventListener("lostpointercapture", off);
      b.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (performance.now() > bloqueio) seg = true; } });
      b.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") seg = false; });
      info.textContent = "Segure quando ele for olhar. Solte para recuperar o fôlego.";
      cronometro(a.dur, () => acabar(true), now => {
        if (!ameaca) return;
        const dt = Math.min(.1, (now - ult) / 1000); ult = now; ciclo(now);
        if (ameaca.estado === "anda") ameaca.passo += dt;
        if (seg) folego -= dt / (a.folego || 3.2); else folego = Math.min(1, folego + dt / 2.2);
        if (seg && folego <= 0) { seg = false; folego = 0; bloqueio = now + 900; tocar("respira"); vibrar(150); }
        ameaca.escondido = seg;
        if (ameaca.estado === "olha" && !seg) return pego(now);
        b.firstChild.style.width = Math.max(0, folego) * 100 + "%";
        b.lastChild.textContent = seg ? (folego < .3 ? "Sem ar!" : "Escondido") : now < bloqueio ? "Sem fôlego…" : ameaca.estado === "aviso" ? "Esconda-se!" : "Segure";
        b.classList.toggle("perigo", ameaca.estado !== "anda" && !seg); b.classList.toggle("seguro", seg);
      });
    } else {
      let n = 0;
      const andar = e => {
        if (e) e.preventDefault(); if (meu !== tok || !ameaca) return;
        const now = performance.now();
        if (ameaca.estado === "olha") return pego(now);
        n++; ameaca.prog = n / a.n; ameaca.andando = now + 260; tocar("passoLeve");
        b.firstChild.style.width = ameaca.prog * 100 + "%";
        if (n >= a.n) acabar(true);
      };
      b.addEventListener("pointerdown", andar);
      b.addEventListener("keydown", e => { if ((e.key === " " || e.key === "Enter") && !e.repeat) andar(e); });
      b.addEventListener("click", e => e.preventDefault());
      info.textContent = "Toque para andar. Quando ele virar, pare de tocar.";
      cronometro(a.limite || 30, () => acabar(false), now => {
        if (!ameaca) return; ciclo(now);
        b.lastChild.textContent = ameaca.estado === "olha" ? "PARE!" : ameaca.estado === "aviso" ? "Cuidado…" : "Avançar · " + n + " / " + a.n;
        b.classList.toggle("perigo", ameaca.estado !== "anda");
      });
    }
    b.focus({ preventScroll: true });
  }

  if (a.tipo === "codigo") {
    let dig = "", tent = a.tentativas;
    const slots = document.createElement("div"); slots.className = "slots";
    const info = document.createElement("div"); info.className = "hint"; info.style.textAlign = "center";
    const pad = document.createElement("div"); pad.className = "pad";
    const desenhar = () => {
      slots.innerHTML = [...a.resposta].map((_, i) => `<b>${dig[i] || ""}</b>`).join("");
      info.textContent = tent + (tent === 1 ? " tentativa restante" : " tentativas restantes");
    };
    const conferir = () => {
      if (dig === a.resposta) return acabar(true);
      tent--; tocar("erro"); slots.classList.remove("shake"); void slots.offsetWidth; slots.classList.add("shake");
      dig = ""; desenhar(); if (tent <= 0) acabar(false);
    };
    const apertar = k => {
      if (meu !== tok) return;
      if (k === "⌫") dig = dig.slice(0, -1);
      else if (dig.length < a.resposta.length) { dig += k; tocar("tique"); }
      desenhar();
      if (dig.length === a.resposta.length) setTimeout(conferir, 250);
    };
    ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "⌫"].forEach((k, i) => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = k; b.id = "tecla-" + i;
      if (!k) b.style.visibility = "hidden"; else b.addEventListener("click", e => { e.stopPropagation(); apertar(k); });
      if (k === "⌫") b.setAttribute("aria-label", "Apagar");
      pad.appendChild(b);
    });
    wrap.append(slots, pad, info); desenhar();
    const tecla = e => { if (meu !== tok) return document.removeEventListener("keydown", tecla); if (/^\d$/.test(e.key)) apertar(e.key); else if (e.key === "Backspace") apertar("⌫"); };
    document.addEventListener("keydown", tecla);
  }
}

$("scene").addEventListener("click", () => { if (cineAtual && cineAtual.fim) return pularCine(); typing && typing.skip(); });
document.addEventListener("pointerdown", e => { if (document.body.classList.contains("cine") && !e.target.closest(".top")) pularCine(); });
document.addEventListener("keydown", e => {
  if (!$("hub").hidden || !$("drawer").hidden) return;
  if (cineAtual && cineAtual.fim) { if (e.key === " " || e.key === "Enter") { e.preventDefault(); pularCine(); } return; }
  if (document.activeElement && document.activeElement.classList.contains("big")) return;
  if (ameaca) return;
  if ($("choices").querySelector(".pad")) return;
  const k = e.key.toLowerCase();
  const i = "abcd".indexOf(k) >= 0 ? "abcd".indexOf(k) : "1234".indexOf(e.key);
  if (i >= 0) { const b = $("op-" + i); if (b && !b.disabled) b.click(); }
  else if (e.key === " " && typing) { e.preventDefault(); typing.skip(); }
});

function desenharConquistas() {
  $("conqs").innerHTML = CONQ.map(([id, nome, desc]) => `<div class="conq ${conqFeitas.has(id) ? "ok" : ""}"><i>${conqFeitas.has(id) ? "★" : "?"}</i><div><b>${nome}</b><br><span>${desc}</span></div></div>`).join("");
}
function abrirFinais(soConquistas) {
  if (soConquistas || !S) {
    $("drawerTitle").textContent = "Conquistas";
    $("drawerSub").textContent = conqFeitas.size + " de " + CONQ.length + " conquistas · " + totalFinais() + " de " + totalPossivel() + " finais";
    $("endGrid").innerHTML = "";
  } else {
    const L = finaisDe(S);
    $("drawerTitle").textContent = "Finais · " + FASES[S].titulo;
    $("drawerSub").textContent = "Cada escolha leva a um lugar diferente. Finais secretos aparecem como lembranças depois que você conhece a história.";
    $("endGrid").innerHTML = L.map((k, i) => {
      const f = NOS[k], ok = descobertos[S].has(k), sec = f.tipo === "secreto";
      return "<div class='slot " + (ok ? "" : "locked") + "'><span class='n'>" +
        String(i + 1).padStart(2, "0") + " · " + (ok ? TAG[f.tipo] : sec ? "Secreto" : "Bloqueado") +
        "</span><span class='t" + (sec && ok ? " secreto" : "") + "'>" + (ok ? f.titulo : "???") + "</span></div>";
    }).join("");
  }
  desenharConquistas();
  $("drawer").hidden = false; $("closeEndings").focus();
}
$("btnConq").addEventListener("click", () => abrirFinais(true));
$("openEndings").addEventListener("click", () => abrirFinais(false));
$("closeEndings").addEventListener("click", () => { $("drawer").hidden = true; });

/* ---------- menu de fases ---------- */
let pendente = null;
function abrirHub() {
  tok++; pararTudo(); if (typing) typing.stop();
  cineAtual = null; ameaca = null; document.body.classList.remove("cine"); salvarJogo();
  $("choices").innerHTML = ""; $("scene").innerHTML = ""; $("hud").innerHTML = "";
  corDestaque("#f2a33a");
  setVer(["cidade", "acesa"]); setAmb({ drone: .5 });
  let html = "";
  if (pendente) {
    const F = FASES[pendente.S];
    html += `<button class="story continuar" type="button" id="fase-continuar" style="--c:${F.cor}">
      <span class="g"><span>Continuar</span><span>${F.genero}</span></span><h3>${F.titulo}</h3></button>`;
  }
  const tf = totalFinais();
  $("progTotal").textContent = tf + " de " + totalPossivel() + " finais · " + conqFeitas.size + "/" + CONQ.length + " conquistas";
  html += Object.entries(FASES).map(([k, F]) => {
    const tranca = tf < (F.libera || 0), feitos = descobertos[k].size, tot = finaisDe(k).length;
    if (tranca) return `
    <button class="story trancada" type="button" id="fase-${k}" style="--c:${F.cor}" disabled>
      <span class="g"><span>${F.genero}</span><span>Trancada</span></span>
      <h3>${F.titulo}</h3>
      <span class="mec">Descubra ${F.libera} finais para liberar · faltam ${F.libera - tf}</span>
    </button>`;
    return `
    <button class="story" type="button" id="fase-${k}" data-k="${k}" style="--c:${F.cor}">
      <span class="g"><span>${F.genero}${vis[k].size ? "" : " · nova"}</span><span>${feitos}/${tot} finais</span></span>
      <h3>${F.titulo}</h3>
      <span class="gancho">${F.gancho}</span>
      <span class="barra"><i style="width:${tot ? feitos / tot * 100 : 0}%"></i></span>
      <span class="mec">${F.mec}</span>
    </button>`; }).join("");
  $("lista").innerHTML = html;
  $("lista").querySelectorAll("[data-k]").forEach(b => b.addEventListener("click", () => iniciarFase(b.dataset.k)));
  const c = $("fase-continuar");
  if (c) c.addEventListener("click", () => { const p = pendente; pendente = null; iniciarFase(p.S, p); });
  $("hub").hidden = false; $("drawer").hidden = true; document.body.classList.add("no-hub");
}
function iniciarFase(k, salvo) {
  try { initAudio(); } catch (e) {}
  S = k; const F = FASES[k]; NOS = F.nos;
  corDestaque(F.cor);
  caminho = salvo?.caminho || []; inv = salvo?.inv || []; ultimo = null; cineAtual = null;
  medidor = F.medidor ? (salvo?.medidor ?? F.medidor.ini) : null;
  $("hub").hidden = true; $("drawer").hidden = true; document.body.classList.remove("no-hub");
  contador();
  mostrar(salvo?.atual && NOS[salvo.atual] ? salvo.atual : "inicio");
}
$("btnMenu").addEventListener("click", () => { if (S && NOS[atual] && !NOS[atual].fim) pendente = { S, atual, caminho, inv, medidor }; abrirHub(); });

/* ---------- início ---------- */
function start(data) {
  if (!data || !data.S) data = ler("pv_save", null);
  if (data && data.S && FASES[data.S] && FASES[data.S].nos[data.atual]) pendente = data;
  abrirHub();
}
/* ganchos do app Android */
window.voltarAndroid = () => {
  if (!$("drawer").hidden) { $("drawer").hidden = true; return true; }
  if (cineAtual && cineAtual.fim) { pularCine(); return true; }
  if ($("hub").hidden) { $("btnMenu").click(); return true; }
  return false;
};
window.pausarAndroid = p => { if (AC) p ? AC.suspend() : AC.resume(); ultFrame = 0; };
window.margensAndroid = (t, b, l, r) => {
  const st = document.documentElement.style;
  st.setProperty("--sat", t + "px"); st.setProperty("--sab", b + "px"); st.setProperty("--sal", l + "px"); st.setProperty("--sar", r + "px");
};
start({});
</script>
