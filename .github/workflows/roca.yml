name: Roça Assombrada

on:
  push:
  workflow_dispatch:

jobs:
  # celular Android (APK para testar e AAB para a Play Store)
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Compilar versão de teste (APK)
        run: gradle :roca:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RocaAssombrada-APK
          path: roca-assombrada/android/build/outputs/apk/debug/roca-debug.apk
      - name: Preparar chave de assinatura
        id: chave
        env:
          SENHA: ${{ secrets.SENHA_ASSINATURA }}
        run: |
          if [ -z "$SENHA" ]; then echo "Segredo SENHA_ASSINATURA ainda não cadastrado: pulando a versão da loja."; echo "ok=nao" >> "$GITHUB_OUTPUT"; exit 0; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in assinatura/upload.jks.enc -out "$RUNNER_TEMP/upload.jks" -pass env:SENHA
          echo "ok=sim" >> "$GITHUB_OUTPUT"
      - name: Compilar versão da Play Store (AAB)
        if: steps.chave.outputs.ok == 'sim'
        env:
          CHAVE_ARQUIVO: ${{ runner.temp }}/upload.jks
          CHAVE_SENHA: ${{ secrets.SENHA_ASSINATURA }}
        run: gradle :roca:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: steps.chave.outputs.ok == 'sim'
        with:
          name: RocaAssombrada-PlayStore-AAB
          path: roca-assombrada/android/build/outputs/bundle/release/roca-release.aab

  # computador (Windows e Linux/Steam Deck): pasta pronta para subir na Steam
  pc:
    strategy:
      matrix:
        include:
          - os: windows-latest
            alvo: win
            nome: RocaAssombrada-PC-Windows
            pasta: win-unpacked
          - os: ubuntu-latest
            alvo: linux
            nome: RocaAssombrada-PC-Linux
            pasta: linux-unpacked
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Juntar os arquivos do jogo
        shell: bash
        run: |
          sh roca-assombrada/preparar.sh
          mkdir -p roca-assombrada/pc/www && cp -r roca-assombrada/www/* roca-assombrada/pc/www/
          sed -i "s#<script src=\"base.js\"></script>#<script src=\"base.js\"></script><script>window.ROCA_VERSAO=\"1.0.${GITHUB_RUN_NUMBER}\"</script>#" roca-assombrada/pc/www/index.html
          cd roca-assombrada/pc && npm pkg set version="1.0.${GITHUB_RUN_NUMBER}"
      - name: Montar o jogo
        working-directory: roca-assombrada/pc
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install --no-audit --no-fund
          if [ "${{ matrix.alvo }}" = win ]; then npx electron-builder --win dir nsis --x64 --publish never; else npx electron-builder --linux dir --x64 --publish never; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nome }}
          path: roca-assombrada/pc/dist/${{ matrix.pasta }}
      # instalador do Windows (Setup.exe): instala, cria atalho na área de trabalho e no menu Iniciar
      - uses: actions/upload-artifact@v4
        if: matrix.alvo == 'win'
        with:
          name: RocaAssombrada-Instalador-Windows
          path: roca-assombrada/pc/dist/*.exe
